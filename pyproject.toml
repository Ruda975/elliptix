[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elliptix"
description = "A library for elliptic functions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name="Rudolf Rosendorf", email="gdruda975@gmail.com" }]
keywords = ["elliptic", "elliptic functions", "special functions", "math"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.8.0",
    "matplotlib>=3.8.0"
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/Ruda975/elliptix"
"Repository" = "https://github.com/Ruda975/elliptix"
"Bug Tracker" = "https://github.com/Ruda975/elliptix/issues"

[tool.hatch.version]
path = "src/elliptix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/elliptix"]